// 사용할 Gradle 플러그인 목록
plugins {
    // 자바 컴파일/빌드 기능 제공
    id 'java'
    // 스프링 부트 실행·패키징(bootJar) 기능 제공
    id 'org.springframework.boot' version '4.1.2'
    // 스프링 부트 BOM 기반으로 의존성 버전을 자동 관리
    id 'io.spring.dependency-management' version '1.1.7'
}

// 프로젝트 그룹 ID (패키지 식별자)
group = 'com.kdt'
// 프로젝트 버전 (SNAPSHOT = 개발 중)
version = '0.0.1-SNAPSHOT'
// 프로젝트 설명
description = 'kdt-security'

// 자바 관련 설정
java {
    // 사용할 JDK 버전을 지정하는 툴체인
    toolchain {
        // 자바 21로 빌드
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// 라이브러리를 내려받을 저장소
repositories {
    // Maven 중앙 저장소
    mavenCentral()
}

// 프로젝트가 사용하는 의존성 목록
dependencies {
    // JPA(Hibernate)로 DB를 객체처럼 다루는 기능
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // @Valid, @NotBlank 등 입력값 검증 기능
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // Spring MVC 기반 REST API(웹) 기능
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    // Swagger UI로 API 문서를 자동 생성
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
    // 비밀번호 암호화(BCrypt)만 쓰기 위한 Spring Security 암호화 모듈
    implementation 'org.springframework.security:spring-security-crypto'
    // Lombok: 컴파일 시점에만 필요 (getter/setter 등 코드 자동 생성)
    compileOnly 'org.projectlombok:lombok'
    // MySQL 접속용 JDBC 드라이버 (실행 시에만 필요)
    runtimeOnly 'com.mysql:mysql-connector-j'
    // Lombok 어노테이션을 컴파일 때 처리하는 프로세서
    annotationProcessor 'org.projectlombok:lombok'
    // JUnit, Mockito 등 기본 테스트 도구
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // JPA 슬라이스 테스트(@DataJpaTest) 지원
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    // 검증(Validation) 관련 테스트 지원
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    // MVC 슬라이스 테스트(@WebMvcTest, MockMvc) 지원
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    // 테스트 코드에서도 Lombok 사용 가능하게 함
    testCompileOnly 'org.projectlombok:lombok'
    // Gradle이 JUnit 테스트를 실행할 때 필요한 런처
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // 테스트용 인메모리 DB (MySQL 대신 사용)
    testRuntimeOnly 'com.h2database:h2'
    // 테스트 코드의 Lombok 어노테이션 처리
    testAnnotationProcessor 'org.projectlombok:lombok'
    // JWT 발급·검증 코드가 사용할 API 타입입니다.
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    // JWT API의 실행 구현입니다. API 의존성과 역할을 구분합니다.
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    // JWT의 JSON 처리용 실행 모듈입니다. MVC JSON과 다른 사용처입니다.
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
}

// test 태스크 설정
tasks.named('test') {
    // 테스트 실행에 JUnit 5 플랫폼 사용
    useJUnitPlatform()
}
